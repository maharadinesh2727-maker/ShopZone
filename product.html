<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - ShopZone</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <a href="index.html">

                <img
                    src="images/logo.png"
                    alt="ShopZone Logo"
                >

            </a>

        </div>


        <nav>

            <a href="index.html">Home</a>

            <a href="index.html#products">Products</a>

            <a href="index.html#categories">Categories</a>

            <a href="index.html#about">About</a>

        </nav>


        <div class="header-actions">

            <a href="index.html" class="back-btn">
                ← Back
            </a>

        </div>

    </header>


    <!-- PRODUCT DETAILS -->

    <main class="product-details">

        <div class="product-detail-image">

            <img
                id="detailImage"
                src=""
                alt="Product"
            >

        </div>


        <div class="product-detail-info">

            <p
                class="product-category"
                id="detailCategory">
            </p>


            <h1 id="detailName">
                Product Name
            </h1>


            <div
                class="rating"
                id="detailRating">
            </div>


            <h2
                class="detail-price"
                id="detailPrice">
            </h2>


            <p class="description">

                Premium quality product designed
                to give you the best shopping experience.
                Order now and enjoy our quality service.

            </p>


            <div class="detail-actions">

                <label>
                    Quantity:
                </label>


                <div class="detail-quantity">

                    <button id="minusBtn">
                        −
                    </button>

                    <span id="quantity">
                        1
                    </span>

                    <button id="plusBtn">
                        +
                    </button>

                </div>


                <button
                    class="detail-cart-btn"
                    id="addDetailCart">
                    🛒 Add to Cart
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
